<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeAgent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f6f8fa;
        }

        h1 {
            margin-bottom: 4px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        textarea,
        input[type="text"],
        input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 16px;
            padding: 10px;
        }

        textarea {
            height: 90px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            margin-right: 8px;
        }

        pre {
            background: #111;
            color: #eee;
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<h1>SafeAgent</h1>

<div class="subtitle">
    Let AI act. Keep humans in control.
</div>

<div class="card">

    <h2>1. Request</h2>

    <label>User Request</label>

    <textarea id="request">Check this configuration and safely fix problems if needed</textarea>

    <label>Configuration File</label>

    <input
            type="file"
            id="file">

    <button onclick="runAgent()">
        Run SafeAgent
    </button>

</div>

<div class="card">

    <h2>2. Agent Result</h2>

    <pre id="result">
Waiting for request...
    </pre>

</div>

<div
        id="approvalSection"
        class="card hidden">

    <h2>3. Human Approval</h2>

    <p>
        SafeAgent detected a high-risk configuration change.
    </p>

    <label>Key</label>

    <input
            type="text"
            id="key"
            value="logging.level.root">

    <label>New Value</label>

    <input
            type="text"
            id="newValue"
            value="INFO">

    <button onclick="approve()">
        Approve
    </button>

</div>

<div
        id="executionSection"
        class="card hidden">

    <h2>4. Execution / Evidence</h2>

    <pre id="executionResult"></pre>

</div>

<script>

let selectedFile = null;

async function runAgent() {

    selectedFile =
        document.getElementById("file").files[0];

    const request =
        document.getElementById("request").value;

    if (!selectedFile) {

        alert("Please select a configuration file.");

        return;
    }

    const formData = new FormData();

    formData.append(
        "request",
        request
    );

    formData.append(
        "file",
        selectedFile
    );

    document.getElementById("result").textContent =
        "SafeAgent is analyzing...";

    const response =
        await fetch(
            "/api/safeagent/run",
            {
                method: "POST",
                body: formData
            }
        );

    const data =
        await response.json();

    document.getElementById("result").textContent =
        JSON.stringify(
            data,
            null,
            2
        );

    if (data.status === "WAITING_FOR_APPROVAL") {

        document
            .getElementById("approvalSection")
            .classList.remove("hidden");

    } else {

        document
            .getElementById("approvalSection")
            .classList.add("hidden");
    }
}

async function approve() {

    if (!selectedFile) {

        alert("Configuration file is missing.");

        return;
    }

    const key =
        document.getElementById("key").value;

    const newValue =
        document.getElementById("newValue").value;

    const formData =
        new FormData();

    formData.append(
        "file",
        selectedFile
    );

    formData.append(
        "key",
        key
    );

    formData.append(
        "newValue",
        newValue
    );

    formData.append(
        "approvalStatus",
        "APPROVED"
    );

    const response =
        await fetch(
            "/api/safeagent/approve-and-execute",
            {
                method: "POST",
                body: formData
            }
        );

    const data =
        await response.json();

    document
        .getElementById("executionSection")
        .classList.remove("hidden");

    document.getElementById("executionResult").textContent =
        JSON.stringify(
            data,
            null,
            2
        );
}

</script>

</body>
</html>
