<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeAgent | 作業履歴</title>
    <style>
        :root {
            --navy: #071b4d;
            --blue: #0b6df6;
            --cyan: #12b8f4;
            --bg: #f3f7fc;
            --panel: #ffffff;
            --line: #dce6f2;
            --text: #13213b;
            --muted: #70809a;
            --danger: #e83a4b;
            --warning: #ed8b16;
            --success: #0aa878;
            --shadow: 0 12px 30px rgba(25,75,130,.09);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        button { font: inherit; cursor: pointer; }

        .topbar {
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 28px 10px 22px;
            background: #fff;
            border-bottom: 1px solid #e7edf5;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 92px;
            height: 64px;
            object-fit: cover;
            object-position: 50% 18%;
            border-radius: 16px;
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
        }

        .brand-copy strong {
            color: var(--navy);
            font-size: 30px;
            line-height: 1;
            letter-spacing: -.8px;
        }

        .brand-copy span {
            margin-top: 5px;
            color: #4f6e99;
            font-size: 12px;
        }

        .topbar-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            color: #284a7c;
            background: #f4f8fd;
            border: 1px solid #dce8f6;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(10,168,120,.12);
        }

        .app-shell {
            min-height: calc(100vh - 84px);
            display: grid;
            grid-template-columns: 190px minmax(0,1fr);
        }

        .sidebar {
            min-height: calc(100vh - 84px);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
            background:
                radial-gradient(circle at 10% 95%, rgba(18,184,244,.35), transparent 38%),
                linear-gradient(180deg, #0751b2 0%, #062d79 58%, #031d57 100%);
        }

        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            color: rgba(255,255,255,.86);
            background: transparent;
            border: 0;
            border-radius: 11px;
            text-align: left;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(14,174,255,.92), rgba(21,106,246,.95));
            box-shadow: 0 10px 22px rgba(0,33,95,.24);
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 20px;
        }

        .sidebar-brand {
            padding: 14px 8px 4px;
            display: flex;
            flex-direction: column;
            color: #d8edff;
            font-size: 11px;
            line-height: 1.6;
        }

        .sidebar-brand img {
            width: 112px;
            height: 112px;
            object-fit: cover;
            object-position: 50% 18%;
            border-radius: 28px;
            margin-bottom: 10px;
        }

        .sidebar-brand strong {
            color: #fff;
            font-size: 15px;
        }

        .main {
            min-width: 0;
            padding: 18px 20px 38px;
        }

        .panel {
            background: #fff;
            border: 1px solid #e0e9f3;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 18px;
        }

        .title-wrap {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .title-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #0a6beb;
            background: #edf6ff;
            font-size: 25px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            color: #08285f;
            font-size: 28px;
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .refresh-button,
        .close-button,
        .page-button {
            min-height: 42px;
            padding: 9px 15px;
            border: 1px solid #b9d6fa;
            border-radius: 9px;
            color: #0b63d5;
            background: #fff;
            font-weight: 800;
        }

        .total-chip {
            padding: 11px 14px;
            color: #1a4e90;
            background: #eef5fd;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
        }

        .table-wrap {
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 11px;
        }

        table {
            width: 100%;
            min-width: 1450px;
            border-collapse: collapse;
            background: #fff;
            font-size: 12px;
        }

        th {
            padding: 12px 10px;
            color: #3b5474;
            background: #f0f5fa;
            border-right: 1px solid #e1e9f1;
            border-bottom: 1px solid #dce6f2;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            color: #30465f;
            border-right: 1px solid #edf1f6;
            border-bottom: 1px solid #edf1f6;
            vertical-align: middle;
        }

        tbody tr:hover td {
            background: #f9fcff;
        }

        .run-id {
            max-width: 220px;
            font-family: Consolas, "Courier New", monospace;
            word-break: break-all;
            color: #284a7c;
        }

        .truncate {
            max-width: 210px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 46px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .chip-blue { color: #0b6df6; background: #eaf4ff; }
        .chip-green { color: #087b5c; background: #e4f8f0; }
        .chip-red { color: #d82b3c; background: #ffe9ec; }
        .chip-orange { color: #c76e00; background: #fff0d8; }
        .chip-gray { color: #52647c; background: #edf1f6; }

        .file-cell {
            white-space: nowrap;
            color: #173d74;
            font-weight: 700;
        }

        .pagination {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .page-button {
            width: 44px;
            padding: 8px;
        }

        .page-button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .page-label {
            min-width: 120px;
            text-align: center;
            color: #173964;
            font-weight: 800;
        }

        .footer-actions {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
        }

        .loading,
        .error-message {
            padding: 18px;
            text-align: center;
            color: var(--muted);
        }

        .error-message {
            color: #b22234;
        }

        @media (max-width: 900px) {
            .app-shell { display: block; }
            .sidebar { min-height: auto; }
            .side-nav { flex-direction: row; overflow-x: auto; }
            .nav-item { width: auto; flex: 0 0 auto; }
            .sidebar-brand { display: none; }
            .main { padding: 10px; }
            .topbar-badge { display: none; }
        }
    
        /* 作業履歴画面では左側ナビゲーションボタンを非表示 */
        .side-nav {
            display: none !important;
        }

</style>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img src="safeagent-logo.jpeg" alt="SafeAgent" class="brand-logo">
        <div class="brand-copy">
            <strong>SafeAgent</strong>
            <span>設定確認ダッシュボード</span>
        </div>
    </div>
    <div class="topbar-badge">
        <span class="status-dot"></span>
        Safety Gateway
    </div>
</header>

<div class="app-shell">
    <aside class="sidebar">
        <nav class="side-nav">
            <a class="nav-item" href="/">
                <span class="nav-icon">⌂</span><span>ダッシュボード</span>
            </a>
            <a class="nav-item" href="/#requestSection">
                <span class="nav-icon">✓</span><span>設定確認</span>
            </a>
            <a class="nav-item active" href="/history.html">
                <span class="nav-icon">◷</span><span>作業履歴</span>
            </a>
            <a class="nav-item" href="/#resultSection">
                <span class="nav-icon">▤</span><span>設計書比較</span>
            </a>
            <a class="nav-item" href="/manual-edit.html">
                <span class="nav-icon">⌘</span><span>手動修正</span>
            </a>
        </nav>

        <div class="sidebar-brand">
            <img src="safeagent-logo.jpeg" alt="">
            <strong>SafeAgent</strong>
            <span>Let AI act.</span>
            <span>Keep humans in control.</span>
        </div>
    </aside>

    <main class="main">
        <section class="panel">
            <div class="header-row">
                <div class="title-wrap">
                    <div class="title-icon">◷</div>
                    <div>
                        <h1>作業履歴</h1>
                        <p class="subtitle">設定ファイルの確認・変更に関する作業履歴を表示します。過去の実行内容、承認状況、変更結果を確認できます。</p>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="refresh-button" onclick="loadHistory(currentPage)">↻ 最新の情報に更新</button>
                    <span class="total-chip">全 <span id="totalCount">0</span> 件</span>
                </div>
            </div>

            <div id="historyMessage" class="loading">作業履歴を読み込んでいます。</div>

            <div id="historyTableWrap" class="table-wrap" style="display:none;">
                <table>
                    <thead>
                    <tr>
                        <th>run_id</th>
                        <th>記録日時</th>
                        <th>ファイル名</th>
                        <th>依頼内容</th>
                        <th>モード</th>
                        <th>操作内容</th>
                        <th>危険度</th>
                        <th>安全確認の結果</th>
                        <th>承認状況</th>
                        <th>実行結果</th>
                        <th>変更結果の確認</th>
                    </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>

            <div class="pagination">
                <button id="firstButton" class="page-button" onclick="goFirst()">≪</button>
                <button id="prevButton" class="page-button" onclick="goPrev()">‹</button>
                <span id="pageLabel" class="page-label">0 - 0 / 0</span>
                <button id="nextButton" class="page-button" onclick="goNext()">›</button>
                <button id="lastButton" class="page-button" onclick="goLast()">≫</button>
            </div>

            <div class="footer-actions">
                <button class="close-button" onclick="window.close()">閉じる</button>
            </div>
        </section>
    </main>
</div>

<script src="history.js"></script>
</body>
</html>
